  - id: copenhagen_pre
    name: "Copenhagen — pre-cruise"
    type: land
    country: Denmark
    photos_dir: "data/photos/copenhagen_pre"
    dates:
      start: "2026-08-06"
      end: "2026-08-09"
    stay:
      area: "Vesterbro / Nyhavn"
      notes: "City center, walkable to harbor"
    coordinates: [55.6761, 12.5683]
    group:
      notes: "With Doron's parents, brothers and their families"
    logistics:
      arrival: "Fly TLV → CPH on Aug 6"
    days:
      - day: 1
        date: "2026-08-06"
        theme: "Royalty & Harbor"
        stops:
          - name: "King's Gardens (Kongens Have)"
            type: nature
            stroller_friendly: true
            photos_dir: "data/photos/copenhagen_pre/day1_kings_gardens"
            coordinates: [55.6867, 12.5771]
            tips:
              - "Beautifully flat — ideal for Jordan's stroller"
              - "Combine with Rosenborg Castle right next door"
              - "Busy on weekends — arrive before 10am"
          - name: "Rosenborg Castle"
            type: culture
            notes: "For the adults, skip if kids are tired"
            photos_dir: "data/photos/copenhagen_pre/day1_kings_gardens"
            coordinates: [55.6858, 12.5771]
            tips:
              - "Crown Jewels are the highlight — worth the entrance fee"
              - "Skip if Jordan is restless — the gardens outside are free"
          - name: "Torvehallerne Food Market"
            type: food
            notes: "Upscale food stalls, great for groups"
            photos_dir: "data/photos/copenhagen_pre/day1_torvehallerne"
            coordinates: [55.6833, 12.5700]
            tips:
              - "Perfect for a group lunch — everyone finds something"
              - "Try the smørrebrød (open sandwiches) and fresh pastries"
              - "Gets crowded 12–2pm — arrive early or late"
          - name: "Nyhavn Canal Tour"
            type: activity
            notes: "Relaxed boat ride, sees Opera House and Little Mermaid"
            stroller_friendly: true
            photos_dir: "data/photos/copenhagen_pre/day1_nyhavn"
            coordinates: [55.6796, 12.5908]
            tips:
              - "Book the 1hr tour, not the 2hr — better for Jordan's patience"
              - "Hop-on hop-off boats also stop here — flexible option"
              - "Evening cruise is magical with the lit-up houses"
      - day: 2
        date: "2026-08-07"
        theme: "Nature & Magic"
        stops:
          - name: "Valbyparken"
            type: nature
            stroller_friendly: true
            photos_dir: "data/photos/copenhagen_pre/day2_tivoli"
            coordinates: [55.6589, 12.5255]
            tips:
              - "Great morning run/walk for adults while kids play"
              - "Has a large playground — Tavor and Ella will love it"
          - name: "Tivoli Gardens"
            type: activity
            notes: "Dinner at Pincho Nation (circus-themed tapas)"
            photos_dir: "data/photos/copenhagen_pre/day2_tivoli"
            coordinates: [55.6736, 12.5681]
            tips:
              - "Buy tickets online in advance — summer queues are brutal"
              - "Go after 6pm for the evening lights — worth staying for"
              - "Pincho Nation inside is circus-themed tapas, great for families"
              - "Minimum height for big rides is ~120cm — Tavor qualifies, Ella may not for some"
      - day: 3
        date: "2026-08-08"
        theme: "Science & LEGO"
        stops:
          - name: "Experimentarium"
            type: museum
            notes: "Miniverse section for toddlers"
            stroller_friendly: true
            photos_dir: "data/photos/copenhagen_pre/day3_experimentarium"
            coordinates: [55.7297, 12.5776]
            tips:
              - "Miniverse section is perfect for Jordan (1yo) — dedicated toddler zone"
              - "Arrive at opening (10am) — fills up fast in summer"
              - "Allow 2.5–3hrs minimum — kids will not want to leave"
          - name: "The Round Tower (Rundetårn)"
            type: culture
            notes: "Stroller-friendly spiral ramp, panoramic city view"
            stroller_friendly: true
            photos_dir: "data/photos/copenhagen_pre/day3_experimentarium"
            coordinates: [55.6814, 12.5757]
            tips:
              - "Unique spiral ramp (not stairs) — fully stroller-accessible"
              - "Best views of Copenhagen from the top — worth the climb"
              - "Quick visit, 30–45 min is enough"
          - name: "LEGO Flagship Store"
            type: shopping
            photos_dir: "data/photos/copenhagen_pre/day3_experimentarium"
            coordinates: [55.6786, 12.5706]
            tips:
              - "Set a budget per child before entering — they will ask for everything"
              - "Tavor (9) will love the Technic section, Ella (6) the Friends sets"
              - "Free to browse — great even without buying"
    backup_options:
      - name: "Den Blå Planet (National Aquarium)"
        notes: "Shark tunnel"
      - name: "Copenhagen Zoo"
        notes: "Panda house and polar bears"
      - name: "Children's Museum (National Museum)"
        notes: "Viking role-play"
      - name: "Reffen"
        notes: "Huge outdoor street food market on the water"

