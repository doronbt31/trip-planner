  - id: austria_flachau
    name: "Flachau Area — Austria"
    type: land
    country: Austria
    photos_dir: "data/photos/austria_flachau"
    dates:
      start: "2026-08-16"
      end: "2026-08-22"
    stay:
      area: "Flachau"
      notes: "Meeting another family with young kids"
    coordinates: [47.3472, 13.3894]
    group:
      notes: "With Chen's family — brother, sister and their families"
    logistics:
      flight:
        from: "Copenhagen (CPH)"
        to: "Munich (MUC)"
        date: "2026-08-16"
        departure: "12:50"
        arrival: "14:25"
        order: "1119-979-712"
        notes: "Day of cruise disembarkation — 08:00 off ship, 4.5hr buffer before flight"
      car_rental:
        pickup: "Munich (MUC)"
        dropoff: "Munich (MUC)"
        notes: "Returning in Vienna incurs $300-600 one-way fee — avoid"
    days:
      - day_range: "1-3"
        theme: "Acclimatization"
        stops:
          - name: "Flori's Erlebnispfad"
            type: nature
            notes: "Stroller-friendly mountain trail with play stations, Alpine views"
            stroller_friendly: true
            photos_dir: "data/photos/austria_flachau/grafenberg"
            coordinates: [47.3500, 13.3900]
            tips:
              - "Fully stroller-accessible — Jordan can come along"
              - "Interactive play stations along the trail keep kids engaged"
              - "Bring a picnic — Alpine meadow views are stunning"
              - "Morning is best before afternoon clouds roll in"
          - name: "Lucky Flitzer & Reitecksee"
            type: activity
            notes: "Alpine coaster for big kids, calm swimming lake"
            stroller_friendly: false
            photos_dir: "data/photos/austria_flachau/grafenberg"
            coordinates: [47.3450, 13.3850]
            tips:
              - "Alpine coaster is for Tavor — check minimum age/height"
              - "Reitecksee lake is calm and warm enough for swimming in August"
              - "Jordan stays at the lake with one parent while others do the coaster"
          - name: "Hellbrunn Palace — Trick Fountains"
            type: culture
            location: "Salzburg"
            notes: "Hilarious water-splashing for all ages"
            stroller_friendly: true
            photos_dir: "data/photos/austria_flachau/hellbrunn_palace"
            coordinates: [47.7580, 13.0611]
            tips:
              - "Everyone WILL get wet — pack a full change of clothes for all 3 kids"
              - "The trick fountains tour is guided and takes ~45 min"
              - "Combine with a Salzburg old town visit (30 min drive)"
              - "Book timed entry online — queues in August"
      - day_range: "4-6"
        theme: "Group Activities"
        stops:
          - name: "Grafenberg (Wagrain)"
            type: activity
            notes: "Cable car, water rafts, nature park — stroller accessible"
            stroller_friendly: true
            photos_dir: "data/photos/austria_flachau/grafenberg"
            coordinates: [47.3333, 13.3000]
            tips:
              - "Full family day out — cable car, water activities, nature trails"
              - "Check age/weight minimums for Jordan on cable car before going"
              - "Water raft section is the highlight for Tavor and Ella"
              - "Bring swimwear and towels"
          - name: "Jägersee Lake"
            type: nature
            notes: "Turquoise lake, flat easy walking path"
            stroller_friendly: true
            photos_dir: "data/photos/austria_flachau/jagersee_lake"
            coordinates: [47.3667, 13.4167]
            tips:
              - "One of the most beautiful lakes in the region — turquoise alpine water"
              - "Flat walking path all the way around — perfect with Jordan's stroller"
              - "Water is cold even in August — paddling rather than swimming for kids"
              - "Small restaurant at the lake serves excellent Kaiserschmarrn"
          - name: "Geisterberg (Ghost Mountain)"
            type: activity
            notes: "Tractor-train up the mountain, themed play stations"
            stroller_friendly: true
            photos_dir: "data/photos/austria_flachau/grafenberg"
            coordinates: [47.3500, 13.4000]
            tips:
              - "Tractor-train ride up is half the fun — kids love it"
              - "Ghost-themed play stations along the summit trail"
              - "Suitable for all ages including Jordan"
              - "Afternoon activity — cooler once you're up on the mountain"
          - name: "Liechtensteinklamm Gorge"
            type: nature
            notes: "Incredible waterfalls — carrier required, NOT stroller-friendly"
            stroller_friendly: false
            optional: true
            photos_dir: "data/photos/austria_flachau/grafenberg"
            coordinates: [47.3833, 13.3167]
            tips:
              - "Bring a baby carrier for Jordan — strollers cannot do this trail"
              - "One of Austria's most dramatic gorges — narrow wooden walkways over roaring water"
              - "Plan as a half-day: adults take turns carrying Jordan"
              - "Bring a rain jacket — the mist from the falls soaks you"
              - "Allow 2hrs for the full gorge walk"

